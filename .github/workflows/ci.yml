name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-lint:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  integration-tests:
    name: Integration Tests (RLS + Migrations)
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies all migrations)
        run: supabase start
        # supabase start pulls Docker images and runs all 101 migrations.
        # No SUPABASE_ACCESS_TOKEN needed — this is local-only, no remote auth.

      - name: Run integration tests
        run: npm run test:integration
        env:
          # Local Supabase Postgres is always on this port when started via CLI
          INTEGRATION_DB_URL: postgresql://postgres:postgres@localhost:54322/postgres

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public vars are embedded at build time — placeholder values are
          # sufficient for a build check since no server actions run at build time.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://portal.alwaysready.uk
          NEXT_PUBLIC_SENTRY_DSN: https://placeholder@o123456.ingest.de.sentry.io/789
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: placeholder

          # Server-side vars — not embedded in the bundle but required so
          # Next.js doesn't throw on import. Replace with GitHub Secrets if
          # you want the build job to mirror production exactly.
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          RESEND_API_KEY: placeholder
          RESEND_FROM_ADDRESS: AlwaysReady <support@alwaysready.uk>
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_PRICE_ID: price_placeholder
          STRIPE_CHARITY_PRICE_ID: price_placeholder
          STRIPE_BETA_PRICE_ID: price_placeholder
          ANTHROPIC_API_KEY: sk-ant-placeholder
          CLOUDMERSIVE_API_KEY: placeholder
          INBOUND_EMAIL_SECRET: placeholder
          CRON_SECRET: placeholder
          SUPERADMIN_EMAIL: ci@alwaysready.uk
          UNSUBSCRIBE_SECRET: placeholder
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: placeholder
          TURNSTILE_SECRET_KEY: placeholder
          ZEEG_WEBHOOK_TOKEN: placeholder
