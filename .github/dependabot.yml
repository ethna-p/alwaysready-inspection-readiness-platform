version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # react and react-dom must move together (react-dom requires the same react version), and
      # so must their type packages; raised separately, the install fails on a peer conflict.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # Major version bumps need manual review — Dependabot will still flag
      # security vulnerabilities regardless of this setting
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
